name: Generate README figure

on:
  push:
    branches:
      - main
    paths:
      - analyses/plot_signal_behavior_mismatch.py
      - analyses/canonical_maxrl_grpo_objective_comparison/objective_comparison.csv
      - .github/workflows/generate-readme-figure.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  figure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install plotting dependencies
        run: python -m pip install "pandas>=2.2" "matplotlib>=3.8,<3.10"

      - name: Generate figure
        run: python -m analyses.plot_signal_behavior_mismatch

      - name: Commit generated figure
        run: |
          if git diff --quiet -- figures/signal_vs_behavior.png; then
            echo "Figure is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/signal_vs_behavior.png
          git commit -m "docs: regenerate signal-vs-behavior figure"
          git push
